name: ci
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh secure_ssh.sh tests/run.sh
          dash -n secure_ssh.sh && bash -n secure_ssh.sh
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04     # OpenSSH 9.6, dash, ssh.socket-поколение
            shells: "dash bash"
          - image: ubuntu:22.04     # OpenSSH 8.9, первый с sshd_config.d
            shells: "dash bash"
          - image: debian:12        # OpenSSH 9.2
            shells: "dash bash"
          - image: debian:11        # OpenSSH 8.4, mawk
            shells: "dash"
          - image: alpine:3.20      # busybox ash + busybox awk, OpenRC-семейство
            shells: "sh"
          - image: rockylinux:9     # OpenSSH 8.7, gawk, RHEL-семейство
            shells: "bash"
          - image: ubuntu:18.04     # OpenSSH 7.6 (< 8.2, legacy), mawk 1.3.3
            shells: "dash"
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: install deps
        shell: sh
        run: |
          if command -v apt-get >/dev/null; then
            if grep -q 'bionic' /etc/os-release 2>/dev/null; then
              sed -i 's|archive.ubuntu.com|old-releases.ubuntu.com|g; s|security.ubuntu.com|old-releases.ubuntu.com|g' /etc/apt/sources.list
            fi
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server openssh-client netcat-openbsd procps dash >/dev/null
          elif command -v apk >/dev/null; then
            apk add --no-cache openssh openssh-client >/dev/null
          elif command -v dnf >/dev/null; then
            dnf install -y -q openssh-server openssh-clients nmap-ncat procps-ng shadow-utils >/dev/null
          fi
          ssh-keygen -A
          mkdir -p /run/sshd
      - name: run tests
        shell: sh
        run: |
          rc=0
          for s in ${{ matrix.shells }}; do
            echo "=== shell: $s"
            $s tests/run.sh "$s" || rc=1
          done
          exit $rc
